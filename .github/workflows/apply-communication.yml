name: Apply DriverPool24 communication patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch-communication.js'
    branches: [main]

permissions:
  contents: write

jobs:
  patch-communication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply communication patch
        run: node patch-communication.js
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.js server.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add DriverPool24 multilingual communication"
            git push
          fi
