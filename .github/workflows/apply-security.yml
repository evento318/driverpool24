name: Apply DriverPool24 security patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch-security.js'
      - '.github/workflows/apply-security.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  patch-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply security patch
        run: node patch-security.js
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Harden DriverPool24 job access and JWT secret"
            git push
          fi
