<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriverPool24 – Konto erstellen</title><style>:root{--blue:#0b5cff;--navy:#0b1630;--text:#172033;--muted:#64748b;--bg:#f5f8fc;--border:#dbe4f0;--danger:#b91c1c;--success:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(15,35,75,.1)}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--navy);margin-bottom:24px}.mark{width:40px;height:40px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button{flex:1;padding:12px;border-radius:10px;border:1px solid #bfd0f5;background:#fff;color:var(--blue);font-weight:800;cursor:pointer}.tabs button.active{background:#e7efff}.role{display:flex;gap:8px;margin-bottom:18px}.role button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:800;cursor:pointer}.role button.active{border-color:#9db9f5;background:#e7efff;color:var(--blue)}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin-bottom:14px}button.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}button.primary:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:13px;padding:11px 12px;border-radius:9px;font-size:14px;display:none}.msg.error{display:block;background:#fee2e2;color:var(--danger)}.msg.success{display:block;background:#dcfce7;color:var(--success)}.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}.switch{margin-top:18px;text-align:center;font-size:14px}.switch button{border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer}.hidden{display:none}.back{display:block;margin-top:16px;text-align:center;color:var(--muted);font-size:13px}.back a{color:var(--blue);font-weight:800;text-decoration:none}</style></head><body><div class="wrap"><main class="card"><div class="brand"><span class="mark">D</span>DriverPool24</div><div class="tabs"><button id="registerTab" class="active" onclick="showMode('register')">Konto erstellen</button><button id="loginTab" onclick="showMode('login')">Anmelden</button></div><section id="registerView"><p class="hint"><strong>Erster Schritt:</strong> Erstelle zuerst dein persönliches Konto. Danach kannst du dich anmelden und wirst automatisch in deinen Bereich weitergeleitet.</p><div class="role"><button id="registerDriver" class="active" onclick="setRegisterRole('fahrer')">🚛 Fahrer</button><button id="registerCompany" onclick="setRegisterRole('firma')">🏢 Unternehmen</button></div><form id="registerForm"><label>Name / Firmenname</label><input id="registerName" required minlength="2" autocomplete="name" placeholder="Dein Name oder Firmenname"><label>E-Mail</label><input id="registerEmail" type="email" required autocomplete="email" placeholder="name@firma.de"><label>Passwort</label><input id="registerPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Mindestens 8 Zeichen"><button id="registerButton" class="primary" type="submit">Konto erstellen</button><div id="registerMessage" class="msg"></div></form><div class="switch">Du hast bereits ein Konto? <button type="button" onclick="showMode('login')">Jetzt anmelden</button></div></section><section id="loginView" class="hidden"><p class="hint"><strong>Zweiter Schritt:</strong> Melde dich jetzt mit deinem erstellten Konto an.</p><div class="role"><button id="loginDriver" class="active" onclick="setLoginRole('fahrer')">🚛 Fahrer</button><button id="loginCompany" onclick="setLoginRole('firma')">🏢 Unternehmen</button></div><form id="loginForm"><label>E-Mail</label><input id="loginEmail" type="email" required autocomplete="email"><label>Passwort</label><input id="loginPassword" type="password" required autocomplete="current-password"><button id="loginButton" class="primary" type="submit">Anmelden</button><div id="loginMessage" class="msg"></div></form><div class="switch">Noch kein Konto? <button type="button" onclick="showMode('register')">Konto erstellen</button></div></section><div class="back"><a href="/">Zur Startseite</a></div></main></div><script>let registerRole='fahrer',loginRole='fahrer';const tokenKey='driverpool24_token',userKey='driverpool24_user';function setRegisterRole(role){registerRole=role;registerDriver.className=role==='fahrer'?'active':'';registerCompany.className=role==='firma'?'active':''}function setLoginRole(role){loginRole=role;loginDriver.className=role==='fahrer'?'active':'';loginCompany.className=role==='firma'?'active':''}function showMode(mode){const reg=mode==='register';registerView.classList.toggle('hidden',!reg);loginView.classList.toggle('hidden',reg);registerTab.className=reg?'active':'';loginTab.className=reg?'':'active'}function showMsg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className='msg '+type}async function readJson(res){const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Ein Fehler ist aufgetreten.');return data}registerForm.addEventListener('submit',async e=>{e.preventDefault();registerButton.disabled=true;try{const email=registerEmail.value.trim().toLowerCase();const data=await readJson(await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:registerName.value.trim(),email,password:registerPassword.value,role:registerRole})}));showMsg('registerMessage','✓ '+data.message+' Jetzt anmelden.','success');loginEmail.value=email;setLoginRole(registerRole);setTimeout(()=>showMode('login'),700)}catch(err){showMsg('registerMessage',err.message,'error')}finally{registerButton.disabled=false}});loginForm.addEventListener('submit',async e=>{e.preventDefault();loginButton.disabled=true;try{const data=await readJson(await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail.value.trim().toLowerCase(),password:loginPassword.value,role:loginRole})}));localStorage.setItem(tokenKey,data.token);localStorage.setItem(userKey,JSON.stringify(data.user));showMsg('loginMessage','✓ Anmeldung erfolgreich. Dein Bereich wird geöffnet …','success');setTimeout(()=>location.href=data.user.role==='firma'?'/company.html':'/driver.html',400)}catch(err){showMsg('loginMessage',err.message,'error')}finally{loginButton.disabled=false}});</script></body></html>
